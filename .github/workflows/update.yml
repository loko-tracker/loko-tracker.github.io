# Обновление сайта в облаке.
#
# Трижды в сутки GitHub сам запускает этот сценарий: скачивает свежие
# данные КХЛ и сайта клуба, пересобирает страницу и выкладывает её на
# GitHub Pages. Домашний компьютер для этого включать не нужно.
#
# Утром — спокойный итог вчерашнего дня. Днём — дальневосточные матчи,
# которые начинаются в полдень по Москве и к трём уже доиграны. Поздним
# вечером — остальные: разбор с голами, звёзды, слова тренера и заново
# посчитанные шансы появляются в тот же день, а не следующим утром.
#
# Кнопка «Run workflow» на вкладке Actions запускает обновление вручную.

name: Обновить сайт

on:
  schedule:
    - cron: "0 5 * * *"        # 08:00 по Москве
    - cron: "30 12 * * *"      # 15:30 по Москве, после дальневосточных матчей
    - cron: "30 20 * * *"      # 23:30 по Москве, когда вечерние матчи доиграны
  push:
    branches: [main]           # правки кода сразу уезжают на сайт
  workflow_dispatch:

permissions:
  contents: write              # вернуть в репозиторий прогнозы и лазарет
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Логотипы, фото игроков и библиотеки оформления не лежат в
      # репозитории. Без этого их пришлось бы качать заново каждый день.
      - uses: actions/cache@v4
        with:
          path: |
            web/vendor
            web/logos
          key: assets-${{ github.run_id }}
          restore-keys: assets-

      # API лиги иногда подолгу не отвечает: 24.09.2026 утренняя сборка
      # упала на первом же запросе, и сайт простоял без обновления до
      # вечера. Поэтому при неудаче ждём и пробуем снова — три раза за
      # полчаса. Скрипт сам повторяет каждый запрос, но в пределах минут,
      # а сервер лиги, бывает, лежит дольше.
      - name: Собрать сайт
        run: |
          for attempt in 1 2 3; do
            if python run.py --no-serve --no-browser; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "API лиги не ответил (попытка $attempt из 3) — жду семь минут"
              sleep 420
            fi
          done
          echo "API лиги так и не ответил — сайт остаётся прежним до следующего запуска"
          exit 1

      # Прогноз Claude на матч замораживается в момент начала игры, а
      # автоматические отметки о травмах помнят, когда их впервые заметили.
      # Поэтому оба файла возвращаются в репозиторий.
      # Если в это же время в репозиторий приехали правки, push отбивается.
      # Тогда пробуем ещё пару раз, а если так и не вышло — не роняем сборку:
      # сайт важнее, а данные досохранятся следующим запуском.
      - name: Сохранить прогнозы и лазарет
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries.json data/claude_picks.json
          if git diff --cached --quiet; then
            echo "данные не менялись"
            exit 0
          fi
          git commit -m "Данные за $(TZ=Europe/Moscow date +%d.%m.%Y)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "попытка $attempt не прошла, жду"
            sleep 7
          done
          echo "сохранить данные не вышло — сайт собирается дальше"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
