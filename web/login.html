<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — КХЛ 2026/27</title>
<style>
  /* Тема одна и тёмная — как в самом приложении, чтобы вход не вспыхивал
     белым перед тёмной страницей. Все цвета заданы явно. */
  :root {
    color-scheme: dark;
    --plane:   #050810;
    --surface: #121b26;
    --sunk:    #1b2733;
    --ink:     #eef4f8;
    --ink-2:   #a9b8c4;
    --muted:   #7f909f;
    --rule:    #22303d;
    --accent:  #ff4256;
    --ice:     #4fd8ff;
    --bad:     #ff4256;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    position: relative;
    overflow: hidden;
  }
  /* Тот же свет прожекторов, что на основной странице. */
  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
  }
  body::before {
    width: 70vmax; height: 70vmax;
    top: -30vmax; left: -22vmax;
    background: radial-gradient(circle, rgba(79,216,255,.20), transparent 66%);
  }
  body::after {
    width: 55vmax; height: 55vmax;
    bottom: -26vmax; right: -18vmax;
    background: radial-gradient(circle, rgba(255,66,86,.16), transparent 66%);
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 360px;
    background: rgba(18, 27, 38, .78);
    backdrop-filter: blur(12px);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 26px 24px 24px;
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 22px 50px -24px rgba(0,0,0,.95);
  }
  .mark {
    font-family: Oswald, "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: .02em;
    margin: 0 0 2px;
    line-height: 1.15;
  }
  .mark span { color: var(--accent); }
  .sub {
    font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 22px;
  }
  label {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--sunk);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 9px 11px;
    margin-bottom: 14px;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--plane);
    background: var(--ice);
    border: 1px solid var(--ice);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    margin-top: 4px;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px -8px rgba(79,216,255,.8); }
  .error {
    background: rgba(255, 66, 86, .13);
    border: 1px solid rgba(255, 66, 86, .4);
    color: var(--bad);
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 13.5px;
    margin: 0 0 16px;
  }
  .hint {
    font-size: 12.5px;
    color: var(--muted);
    margin: 18px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  code {
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    font-size: 12px;
    background: var(--sunk);
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <main class="card">
    <h1 class="mark">КХЛ <span>2026/27</span></h1>
    <p class="sub">Личный трекер сезона</p>

    <!--ERROR-->

    <form method="post" action="/login" autocomplete="on">
      <label for="login">Логин</label>
      <input type="text" id="login" name="login" autocomplete="username" autofocus required>

      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit">Войти</button>
    </form>

    <p class="hint">Забыл пароль? Восстановить нельзя — он хранится только хэшем. Задай новый: <code>python setup_login.py</code></p>
  </main>
</body>
</html>
